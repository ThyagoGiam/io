                <h1 style="text-align: center;">La scuadra nissena</h1>
                <h2 style="text-align: center;"></h2>
                <h3 style="text-align: center;"></h3>
                <p style="text-align: center;"La Nissa Football Club rappresenta con orgoglio il cuore calcistico della Sicilia centrale, incarnando la passione sportiva della città di Caltanissetta. Fondata originariamente nel 1929 come Unione Sportiva Nissena, la società ha attraversato quasi un secolo di storia fatto di grandi entusiasmi, rifondazioni e un forte legame identitario con il proprio territorio. Storicamente legata ai colori giallo e rosso e all'appellativo di Biancoscudati, la squadra ha vissuto i suoi momenti calcistici più importanti calcando i campi della Serie C tra gli anni '40, '50 e '80, oltre a disputare numerose stagioni in Serie D e nei tornei dilettantistici d'élite.Un aneddoto curioso e celebre che lega la Nissa al grande calcio risale al 1990, quando lo Stadio Comunale di Caltanissetta ospitò un'amichevole della Nazionale Italiana Under 21 contro la Cecoslovacchia: in quell'occasione, a causa di una sovrapposizione di divise, gli Azzurrini scesero in campo indossando la maglia della Nissa. Oggi la squadra gioca le sue partite casalinghe nel maestoso Stadio Marco Tomaselli (noto anche come Pian del Lago), un impianto da circa 12.000 posti che testimonia le ambizioni e il blasone di una piazza che non ha mai smesso di sostenere con calore i propri colori </p>
